    <!-- Custom Style for Cute Pastel Aesthetics & Grid Background -->
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fdfbf7;
            color: #4a3e3d;
        }

        /* Pastel polka dot grid background */
        .bg-pastel-dots {
            background-image: radial-gradient(#f3d5d8 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        /* Pastel Glass Card Style */
        .pastel-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #fce7f3;
        }

        .pastel-card-peach {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid #ffedd5;
        }

        .pastel-card-sky {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid #e0f2fe;
        }

        .pastel-card-purple {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid #f3e8ff;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #fdfbf7;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8;
            border-radius: 9999px;
            border: 2px solid #fdfbf7;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f472b6;
        }

        /* Soft Floating Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: floatSlow 5s ease-in-out infinite;
        }

        @keyframes pulseSoft {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.08); opacity: 0.9; }
        }
        .animate-pulse-soft {
            animation: pulseSoft 4s ease-in-out infinite;
        }

        /* Print styles optimization */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .pastel-card { border: 1px solid #ddd !important; box-shadow: none !important; }
        }
    </style>
</head>
